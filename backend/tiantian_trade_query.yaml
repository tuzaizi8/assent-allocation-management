# 天天基金 App「交易查询」列表截图平台适配（项目根目录，与 .env.dev 同级）
# 这一页**不出现平台名**（只有「交易查询 / 活期宝 / 近1年交易总览」），所以指纹取 App 页面独有词；
# 「天天基金」这类平台名留给 tiantian.yaml（那份是 table 模式，面向带平台名的网页/导出件）。
# 结构：每条 3 行——「图标+类型+金额或份额」→「基金名称」→「日期 状态」，按月分组（2026年07月）。
key: tiantian_trade_query
name: 天天基金交易查询(列表)
# 平台标识:与 tiantian.yaml(对账单) 同一平台,见该文件说明
platform: tiantian
fingerprints: ["近1年交易总览", "活期宝"]
mode: listItem
# 撤单与失败的单子不落库；进行中的等确认后再导
# 注意：不要把「银行卡」当关键词——卖出行的类型词就是「卖出回银行卡」，会误杀整条记录
skip_keywords: ["已撤单", "已撤销", "交易失败", "交易进行中"]
# 顶部汇总行「买入① 卖出⑨ 定投 分红」同时含买卖两个方向词 → 整块跳过
skip_when_all_of: ["买入", "卖出"]
# 这类行也要能开新块，否则会被上一条吞掉（既丢记录、又把名称污染成一长串）
entry_words: ["红利再投资", "分红"]
# 分红行按「有份额 / 只有金额」两态分流落库(2026-09-23，与表格型 tiantian.yaml 同一套口径)：
# 「红利再投资 30.97份」→ 0 成本买入；「现金分红 0.42元」→ 0 份额 + 金额取负冲减成本。
# 「红利再投」是「红利再投资」的前缀、「分红」是「现金分红」的子串，两个词覆盖全部头词形态。
dividend_words: ["红利再投", "分红"]
# 头行是「图标 + 类型 + 金额」，名称在下一行 → 名称只取续行
name_source: rest
# 月份分组标题：关闭当前块 + 给出年份（截图里的日期没有年份，且同屏会跨年）
group_headers: ["%Y年%m月"]
# 「30.97份」是份额、「52.17元」是金额
share_units: ["份"]
fields:
  date: ["交易日期", "日期"]        # 列表式按行判日期，别名仅为满足适配器必填校验
  fundCode: ["基金代码"]            # 截图里没有代码：抽取阶段留空，由名称解析补齐
  fundName: ["基金名称"]
  type: ["交易类型"]                # 方向词（买入/卖出/定投…）取自起始行
  amount: ["金额"]
  shares: ["份额"]
clean:
  strip_chars: ["¥", "￥", "元"]
  date_patterns: ["%Y-%m-%d", "%Y/%m/%d", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M"]
  # 无年份日期：年份取自分组标题；OCR 常把空格吃掉（11-2414:51:32），故带空格与不带空格两种都列
  date_without_year_patterns: ["%m-%d %H:%M:%S", "%m-%d %H:%M", "%m-%d%H:%M:%S", "%m-%d%H:%M", "%m-%d"]
