# 支付宝交易明细平台适配（项目根目录，与 .env.dev 同级）
# 新增平台 = 复制本文件改名（文件名随意）→ 改 key / fingerprints / fields 别名 → 不用改代码。
# 字段名只能用这些：orderNo date fundCode fundName type applyShares shares amount unitPrice fee
key: alipay
name: 支付宝
# 平台标识(交易导入判重的作用域):与 alipay_trade_list.yaml(截图) 同为支付宝——
# 两个适配器的记录属于同一平台,互相判重;不同平台之间永不判重(金额汇总)。
platform: alipay
# 平台指纹：命中即优先选中本适配器（文件里出现的任一字符串）
fingerprints: ["蚂蚁", "支付宝", "基金销售"]
# 抽取模式：table = 表头行 → 列名映射（Excel / 文本层 PDF）；labelValue = 逐块就近取值（卡片式 PDF）
mode: table
# 表头行定位：这两列是交易明细的骨架
header_keywords: ["订单号", "基金代码"]
# 数据行里出现这些词就跳过（重复表头行 / 汇总行 / 平台页脚）
skip_keywords: ["基金交易明细", "手续费合计", "合计", "订单号", "交易时间", "基金名称", "基金代码", "申请金额", "申请份额", "确认金额", "确认份额", "手续费", "确认日期", "交易类型"]
fields:
  orderNo:     ["订单号"]
  date:        ["确认日期", "交易时间", "申请日期"]   # 按顺序取第一个命中的列
  fundCode:    ["基金代码"]
  fundName:    ["基金名称"]
  # 方向主判据（2026-09-20 补）：用户买入/定投买入 → 买入；用户卖出 → 赎回；
  # 认不出的类型（如「用户跨TA转换」）由代码退回「申请金额 / 申请份额」两列判定，见 statement_adapters._resolve_type
  type:        ["交易类型"]
  # 申请金额与申请份额**成对**出现(col6/col7)且互斥:申购/转换**转入**只申请金额、申请份额写 '/';
  # 赎回/转换**转出**只申请份额、申请金额写 0.00。类型列认不出时(如「用户跨TA转换」)就靠这两列
  # 分方向——只映射「申请份额」一列是不够的:那列写 0.00 同样代表"没申请份额"。
  applyAmount: ["申请金额"]
  applyShares: ["申请份额"]                          # 仅在类型列缺位/认不出时才用它判方向（空/0 → 买入；有值 → 赎回）
  amount:      ["确认金额", "申请金额"]
  shares:      ["确认份额"]
  fee:         ["手续费"]
# 行级分红分流(2026-09-22):「机构分红」既有红利再投资(确认份额 > 0)、也有现金分红(确认金额 > 0),
# 从前分不开只能整行跳过 → 现在按「有份额还是有金额」自动分流(份额 → 0 成本买入;只有金额 → 金额取负冲减成本)。
# 见 statement_adapters._build_record 的分红分支。
dividend_words: ["机构分红"]
clean:
  strip_chars: ["¥", "￥", "元"]
  date_patterns: ["%Y-%m-%d", "%Y/%m/%d", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M"]
tolerance:
  amount_vs_value: 0.02   # 金额与「份额 × 净值」相对偏差上限（PDF 转 Excel 会有几分钱漂移）
