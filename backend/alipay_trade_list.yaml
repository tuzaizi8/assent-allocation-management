# 支付宝「交易记录」列表截图平台适配（项目根目录，与 .env.dev 同级）
# App 截图没有表头行：按「方向词开新条 + 后续行归入本条」抽取，
# 抽出类型 / 基金名 / 金额 / 交易日期；基金代码与份额分别由名称解析、当日净值补齐。
key: alipay_trade_list
name: 支付宝交易记录(列表)
# 平台标识:与 alipay.yaml(PDF/Excel) 同一平台,见该文件说明
platform: alipay
# 指纹取 App 页面独有词：不用「支付宝」等平台名(这张截图里一个都不出现)
fingerprints: ["全部持有", "收益明细", "交易进行中"]
mode: listItem
# 命中即整条跳过(已撤销/失败的单子不该按买入落库)
skip_keywords: ["已撤销", "交易失败", "撤单"]
# 顶部筛选栏「明细 基金  分红▾」也含「分红」会误开块：同时出现这两词的只有筛选行
skip_when_all_of: ["明细", "基金"]
# 分红行(2026-09-23):App 交易记录里类型词就是「分红」，两态混排——「5.80元」=现金分红(0 份额 +
# 金额取负冲减成本)、「1.95份」=红利再投资(0 成本买入)，靠份额/金额自动分流(与表格型 alipay.yaml 同一口径)
entry_words: ["分红"]
dividend_words: ["分红"]
# 「1.95份」认成份额(红利再投资形态)——没有它,份形态的分红行抽不出数值
share_units: ["份"]
# 名称起点标记(OCR 可能把竖线识成 丨、或整个吃掉)
name_prefixes: ["基金|", "基金丨", "基金"]
# 状态文案:会与名称挤在同一行(OCR 折行),拼名称时剔掉
status_words: ["交易进行中", "交易确认中", "确认成功", "部分确认"]
fields:
  date: ["交易日期"]        # 列表式按行为判日期，别名仅为满足适配器必填校验
  fundCode: ["基金代码"]     # 截图里没有代码：抽取阶段留空，由名称解析补齐
  fundName: ["基金名称"]
  type: ["交易类型"]         # 方向词(买入/定投/卖出/赎回)即取自起始行
  amount: ["金额"]
clean:
  strip_chars: ["¥", "￥", "元"]
  date_patterns: ["%Y-%m-%d", "%Y/%m/%d", "%Y-%m-%d %H:%M", "%Y-%m-%d %H:%M:%S"]
