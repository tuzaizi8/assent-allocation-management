name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端门禁(lint + types + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: 类型检查
        working-directory: frontend
        run: pnpm check-types
      - name: 单元测试
        working-directory: frontend
        run: pnpm test run

  backend:
    name: 后端门禁(ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      # JWT/DB 配置在导入期实例化,CI 用 dummy 值生成 .env.dev 使 pytest 可导入
      - name: 生成 CI 用 .env.dev
        working-directory: backend
        run: |
          cp .env.example .env.dev
          sed -i.bak 's/change-me-base64-32-bytes/ci-dummy/' .env.dev && rm .env.dev.bak
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Pytest
        working-directory: backend
        run: pytest -q
