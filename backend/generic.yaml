# 通用（语义兜底）平台适配（项目根目录，与 .env.dev 同级）
# 无平台指纹命中时用它：只按「语义列名」认字段，任何平台的表头只要含这些词就能认出来。
# 不要删这个文件——detect_adapter 找不到任何指纹命中时回落它。
key: generic
name: 通用
# 平台标识:兜底适配器自成一个平台(不配则回落 key,这里显式写出来)
platform: generic
fingerprints: []                      # 兜底适配器不参与指纹打分
mode: table
header_keywords: ["基金代码", "金额", "份额"]
skip_keywords: ["交易明细", "合计", "总计", "订单号", "流水号", "基金代码", "基金名称", "交易类型", "申请金额", "申请份额", "确认金额", "确认份额", "手续费"]
# 手工整理的平台交易明细(如招商银行那份 Excel)把分红直接写在「交易类型」列:
# 「红利再投」= 有份额的 0 成本买入,「现金分红」= 只有金额、金额取负冲减持仓成本
dividend_words: ["红利再投", "现金分红"]
fields:
  orderNo:     ["订单号", "流水号", "成交编号", "业务编号"]
  date:        ["确认日期", "交易日期", "申请日期", "确认时间", "交易时间", "日期"]
  fundCode:    ["基金代码", "产品代码", "代码"]
  fundName:    ["基金名称", "基金简称", "产品名称", "名称"]
  type:        ["交易类型", "业务类型", "交易方向", "类型"]
  applyShares: ["申请份额"]
  amount:      ["确认金额", "申请金额", "成交金额", "金额"]
  shares:      ["确认份额", "成交份额", "份额"]
  unitPrice:   ["确认净值", "成交净值", "净值", "单位净值"]
  fee:         ["手续费", "费用", "佣金"]
clean:
  strip_chars: ["¥", "￥", "元"]
  # 带秒的两种是给「Excel 真日期单元格」用的:读取侧只做 str(),日期会变成
  # 2026-09-25 00:00:00;与 statement_adapters.DEFAULT_DATE_PATTERNS 对齐
  date_patterns: ["%Y-%m-%d", "%Y/%m/%d", "%Y年%m月%d日", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M", "%Y-%m-%d %H:%M:%S", "%Y/%m/%d %H:%M:%S"]
