# 天天基金（东方财富）交易明细平台适配（项目根目录，与 .env.dev 同级）
# 新增平台 = 复制本文件改名 → 改 key / fingerprints / fields 别名 → 不用改代码。
# 列名以**导出件实际列名**为准：对账单 PDF 里名称列叫「基金简称」（不叫「基金名称」）、
# 方向列叫「业务类型」、净值列叫「确认净值」；名称与方向都按这里的原样对上才能抽出来。
key: tiantian
name: 天天基金
# 平台标识(交易导入判重的作用域):与 tiantian_trade_query.yaml(截图) 同为天天基金
platform: tiantian
fingerprints: ["天天基金", "东方财富", "天天基金网"]
mode: table
header_keywords: ["基金代码", "确认份额"]
# 「修改分红方式」是业务类型里的非交易行(份额/金额/净值全 0、不动钱),整行跳过
skip_keywords: ["交易明细", "合计", "订单号", "流水号", "申请时间", "确认时间", "基金代码", "基金名称", "交易类型", "业务类型", "申请金额", "确认金额", "确认份额", "手续费", "修改分红方式"]
# 分红明细表(表头「确认日期/基金代码/基金简称/分红方式/分红金额/分红再投份额/确认净值」)不再整表跳过:
# 「分红方式」的值落到 type 列,由 dividend_words 按行分流(有份额 = 红利再投资 → 0 成本买入;
# 只有金额 = 现金分红 → 0 份额 + 金额取负,冲减持仓成本)。
# 份额与金额两列靠别名里的「份额」「金额」子串匹配到,不用另列别名。
dividend_words: ["红利再投", "现金分红"]
fields:
  orderNo:     ["订单号", "流水号", "成交编号"]
  date:        ["确认日期", "申请时间", "确认时间", "交易日期"]
  fundCode:    ["基金代码"]
  fundName:    ["基金简称", "基金名称"]   # 导出件里叫「基金简称」,别名要按导出件原样写
  type:        ["交易类型", "业务类型", "交易方向", "分红方式"]   # 有值即按「申购/买入」与「赎回/卖出」判定方向
  amount:      ["确认金额", "申请金额", "金额"]
  applyShares: ["申请份额"]
  shares:      ["确认份额", "份额"]
  fee:         ["手续费", "费用"]
clean:
  strip_chars: ["¥", "￥", "元"]
  date_patterns: ["%Y-%m-%d", "%Y/%m/%d", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M"]
